name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install V
        run: |
          git clone https://github.com/vlang/v /tmp/vlang
          cd /tmp/vlang
          make
          echo "/tmp/vlang" >> "$GITHUB_PATH"

      - name: Build
        run: make build

      - name: Create source artifact
        run: make release

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.tar.gz \
            --title "shae-v-terminal-system-monitor ${{ github.ref_name }}" \
            --generate-notes
